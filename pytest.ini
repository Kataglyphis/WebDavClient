[pytest]
testpaths = tests
; bench/demo_pytest_benchmark.py keeps the name the hub's ci_tests.sh calls, so `pytest bench/` collects it too.
python_files = test_*.py *_test.py demo_pytest_benchmark.py
; norecursedirs = .git ignore build __pycache__ data docker docs .eggs

; filterwarnings= default
;                 ignore:.*No cfgstr given in Cacher constructor or call.*:Warning
;                 ignore:.*Define the __nice__ method for.*:Warning
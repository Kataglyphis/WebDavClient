version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Their [build-system] requirements already admit every release; Dependabot's uv updater then fails with "No files have changed!".
    ignore:
      - dependency-name: "setuptools"
      - dependency-name: "cython"

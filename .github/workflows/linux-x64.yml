name: Linux x64 · build + test

# The one build lane every push runs (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md).

# Configuration for the hub's reusable lane only: do not re-inline its steps, runner or image here.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# A called workflow runs on the caller's token; unset, the lane would get the repository default (write).
permissions:
  contents: read

# Per lane and caller (github.workflow is the caller's name when called); default-branch runs always finish.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  linux:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-linux.yml@develop
    with:
      arches: x64
      package-name: kataglyphis_webdavclient
      # No version named: the hub runs the pinned X.Y and its X.Yt twin, which syncs only the tests extra and gates.
      free-threaded-extras: tests
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      # This repo stores the FTP password as PASSWORD; the lane takes a neutral name.
      FTP_PASSWORD: ${{ secrets.PASSWORD }}

# .github/workflows/windows-x64.yml
name: Windows x64 · build + test

# Configuration for the hub's reusable lane only: do not re-inline its steps here.

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Per lane and caller (github.workflow is the caller's name when called); default-branch runs always finish.
concurrency:
  group: windows-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  windows:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-windows.yml@develop
    with:
      # Full history: this repo's packaging derives its version from git.
      fetch-depth: 0
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

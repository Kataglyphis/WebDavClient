# .github/workflows/windows-x64.yml
name: Windows x64 · build + test

# The lane lives in ANTfrastructure as a reusable workflow; this file is only
# its configuration. Do not re-inline the steps: this repo and OrchestrANT
# previously carried ~70-line copies that differed on 20 lines, all of it
# drift rather than intent.
#
# This repo's behaviour is unchanged by the move - the shared lane took the safer
# option wherever the two copies disagreed, and in every case that was this one's
# (upload on always(), if-no-files-found: warn, logs/ + docs/test_results/ in the
# artifact, upload-artifact v7).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Same reasoning as the Linux lane: python-ci-windows.yml declares
# `contents: read` itself, a called workflow runs on the caller's token, and
# the only registry credential in the lane is secrets.GHCR_PAT.
permissions:
  contents: read

jobs:
  windows:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-windows.yml@main
    with:
      # Full history: this repo's packaging derives its version from git.
      fetch-depth: 0
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

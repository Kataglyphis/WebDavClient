name: Linux arm64 · build + test

# Python versions must match linux-x64.yml's; no FTP secrets, because only the x64 row deploys docs.

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Per lane and caller (github.workflow is the caller's name when called); default-branch runs always finish.
concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  linux:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-linux.yml@develop
    with:
      arches: arm64
      package-name: kataglyphis_webdavclient
      free-threaded-extras: tests
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

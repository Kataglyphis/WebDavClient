name: Windows arm64 · test + wheels

# Configuration for the hub's reusable lane only: :winarm64 stages the legs and wheels, windows-11-arm runs them.

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Per lane and caller (github.workflow is the caller's name when called); default-branch runs always finish.
concurrency:
  group: windows-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  windows-arm64:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-windows.yml@develop
    with:
      build-python-package: false
      arm64-tests: true
      # Cross-built with :winarm64's VS and clang-cl, proved on the device, then uploaded.
      arm64-wheels: true
      # The pinned X.Y and X.Yt, as on Linux: X.Yt syncs only the tests extra; py-spy and line_profiler stay off ARM64 (pyproject.toml).
      arm64-python-versions: 'pinned pinnedt'
      free-threaded-extras: tests
      # The legs test the installed cp315/cp315t wheels, so every module must be the compiled one.
      arm64-test-env: KATAGLYPHIS_EXPECT_COMPILED=1
      # Full history: this repo's packaging derives its version from git.
      fetch-depth: 0
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

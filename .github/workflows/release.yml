# Every push to main is a release: every lane once more on that commit, then v<version> only when all are green (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md).
name: Release · every lane, then v<version>

on:
  push:
    branches: ["main"]
  # On main: the release again, when the pushed run can no longer be rerun. Elsewhere: a dry run.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every lane and collect the release files on this branch, but tag and publish nothing
        type: boolean
        default: false

permissions: {}

# Never two releases at once, and never a cancelled one; a dry run on develop does not hold up main's.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A minute, so a merge without a new version stops before hours of lanes; elsewhere only a dry run runs.
  version:
    if: github.ref == 'refs/heads/main' || inputs.dry-run
    # The grant covers the publish job of the same file; the check job itself takes contents: read.
    permissions:
      contents: write
    uses: Kataglyphis/ANTfrastructure/.github/workflows/release-publish.yml@develop
    with:
      stage: check
      name: WebDavClient
      version-file: VERSION.txt
      dry-run: ${{ inputs.dry-run == true }}

  # The lanes on-request.yml calls, plus linux-x64; each grants what its lane asks for.
  linux-x64:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/linux-x64.yml
    secrets: inherit

  linux-arm64:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/linux-arm64.yml
    secrets: inherit

  windows-x64:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/windows-x64.yml
    secrets: inherit

  windows-arm64:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/windows-arm64.yml
    secrets: inherit

  # needs: every lane, so one red or cancelled lane means no tag and no release.
  release:
    needs: [linux-x64, linux-arm64, windows-x64, windows-arm64]
    permissions:
      contents: write
    uses: Kataglyphis/ANTfrastructure/.github/workflows/release-publish.yml@develop
    with:
      stage: publish
      name: WebDavClient
      version-file: VERSION.txt
      dry-run: ${{ inputs.dry-run == true }}
      # Every lane builds the pure wheel and the sdist under one name; Linux x64's copy ships. The arm64 stage is the device's input, not a deliverable.
      collect: |
        --skip test-reports-*
        --skip python-windows-arm64-stage
        --include *.whl
        --include *.tar.gz
        --exclude */docs/*
        --exclude */logs/*
        --only-from *-py3-none-any.whl=packages-linux-x64-*
        --only-from *.tar.gz=packages-linux-x64-*

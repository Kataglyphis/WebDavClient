name: Lint gates

# The same aggregator as `bash scripts/linux/run-lint-gates.sh`; `ratchets: true` is its --ratchets.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  lint-gates:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      ratchets: true
